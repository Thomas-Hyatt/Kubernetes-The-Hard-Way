- name: Create Droplets
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../core/configs.yaml
    - ../core/credentials.yaml
  tasks:
    - name: Create Jumpbox
      digitalocean.cloud.droplet:
        token: "{{ do_token }}"
        state: present
        name: "{{ jumpbox_name }}"
        region: "{{ region }}"
        size: "{{ jumpbox_size }}"
        image: "{{ image }}"
        ssh_keys:
          - "{{ ssh_key_id }}"
        unique_name: true
      register: jumpbox_result
    - name: Add Jumpbox to Inventory
      ansible.builtin.add_host:
        name: "{{ jumpbox_name }}"
        groups: created_droplets
        ansible_host: >-
          {{
            jumpbox_result.droplet.networks.v4
            | selectattr('type', 'equalto', 'public')
            | map(attribute='ip_address')
            | first
          }}
        ansible_user: root
        ansible_ssh_private_key_file: "{{ ssh_private_key_file }}"

- name: Verify Droplets Operating Systems
  hosts: created_droplets
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
        delay: 5
        timeout: 300
      delegate_to: localhost
    - name: Read OS Release Information
      ansible.builtin.raw: cat /etc/os-release
      register: os_release
      changed_when: false
    - name: Display OS Release Information
      ansible.builtin.debug:
        msg: "{{ os_release.stdout }}"